[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostloop"
version = "0.9.0"
description = "The agent loop, embodied. A tool-using runtime + fail-closed safety pipeline + sim-first execution harness for embodied AI."
readme = "README.md"
license = "MIT"
authors = [{name = "Joe Munene"}]
requires-python = ">=3.10"
keywords = [
    "robotics", "agent", "embodied-ai", "vla", "tool-use",
    "policy-gates", "safety", "mujoco", "ros2", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]

# Core has zero runtime dependencies. Backends pull their own:
#   pip install ghostloop[mujoco]   # MuJoCoBackend (v0.2 — shipped)
#   pip install ghostloop[pybullet] # PyBulletBackend (v0.3 — planned)
#   pip install ghostloop[ros2]     # ROS2Backend (v0.7 — planned)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
mujoco = ["mujoco>=3.0"]
pybullet = ["pybullet>=3.2"]
gym = ["gymnasium>=0.29"]
ros2 = []  # rclpy is system-installed; this extra exists for documentation only.
mcp = ["mcp>=1.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20"]

[project.scripts]
ghostloop = "ghostloop.__main__:main"

[project.urls]
Homepage = "https://github.com/joemunene-by/ghostloop"
Repository = "https://github.com/joemunene-by/ghostloop"
"Sister Project — GhostLM" = "https://github.com/joemunene-by/GhostLM"

[tool.setuptools.packages.find]
include = ["ghostloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
