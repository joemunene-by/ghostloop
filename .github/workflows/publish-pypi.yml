name: Publish to PyPI

# Triggers on a pushed tag matching v*. Tag a release like:
#   git tag -a v1.0.1 -m "v1.0.1 — bugfix"
#   git push origin v1.0.1
# and this workflow builds + uploads to PyPI via Trusted Publishing.
#
# REQUIRES (one-time, on the PyPI side):
#   1. Create the project on PyPI by uploading once manually OR
#      pre-register it via the trusted-publishing setup form at
#      https://pypi.org/manage/account/publishing/
#   2. Add a Trusted Publisher with:
#        Repo:      joemunene-by/ghostloop
#        Workflow:  publish-pypi.yml
#        Env name:  pypi
#   No PyPI API token needs to live in the repo. PyPI verifies the
#   GitHub OIDC claim and authorises the upload.

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab too.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build sdist + wheel and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ghostloop
    permissions:
      # Required by the official PyPA action for OIDC trusted publishing.
      id-token: write
      # Required by softprops/action-gh-release to create the release page.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify version matches the tag
        run: |
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          PKG_VERSION=$(python -c "import re,pathlib;m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('ghostloop/__init__.py').read_text()); print(m.group(1))")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "ghostloop/__init__.py: $PKG_VERSION"
          echo "git tag: $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ] || [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — fix pyproject.toml + ghostloop/__init__.py to match the tag and re-tag."
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel + sdist metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No password / token field — OIDC handles authentication.
          # If TestPyPI dry-runs are needed, swap the repository-url:
          # repository-url: https://test.pypi.org/legacy/
          print-hash: true

      - name: Upload wheel as workflow artifact
        # Useful for downloading the exact wheel that was published from
        # the Actions UI, in case PyPI search is slow.
        uses: actions/upload-artifact@v4
        with:
          name: ghostloop-${{ github.ref_name }}
          path: dist/
          retention-days: 90

      - name: Extract CHANGELOG notes for this version
        # Pulls the section between `## [X.Y.Z]` and the next `## [` header
        # out of CHANGELOG.md so the GitHub release page mirrors the
        # changelog entry exactly. If no matching section exists, falls
        # back to a generic "see CHANGELOG.md" stub so the release still
        # creates.
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          NOTES_FILE="$(mktemp)"
          # Awk grabs the lines from `## [VERSION]` up to (but not
          # including) the next `## [` header.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            cat > "$NOTES_FILE" <<EOM
## ghostloop v$VERSION

See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the full notes.

\`\`\`bash
pip install ghostloop==$VERSION
\`\`\`

Live demo: https://huggingface.co/spaces/Ghostgim/ghostloop-demo
EOM
          fi
          # Append a footer with install + demo links so every release
          # page tells the same story.
          cat >> "$NOTES_FILE" <<EOM

---

## Install

\`\`\`bash
pip install ghostloop==$VERSION
\`\`\`

## Live demo

https://huggingface.co/spaces/Ghostgim/ghostloop-demo

## PyPI

https://pypi.org/project/ghostloop/$VERSION/
EOM
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          # Detect pre-release tags (vX.Y.Z-rc1, vX.Y.Z-alpha, etc.).
          if echo "$VERSION" | grep -qE '-(rc|alpha|beta|pre|dev)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        # Lands every PyPI publish on the GitHub Releases page with the
        # CHANGELOG section as the body and the wheel + sdist attached.
        # `make_latest: legacy` defers to the tag-name semver ordering
        # so non-prereleases auto-promote to "Latest".
        uses: softprops/action-gh-release@v2
        with:
          # ref_name is already the tag like "v1.0.3" — don't double the v.
          name: "${{ github.ref_name }} — ghostloop"
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: dist/*
          draft: false
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: legacy
          fail_on_unmatched_files: true
