name: Publish to PyPI

# Triggers on a pushed tag matching v*. Tag a release like:
#   git tag -a v1.0.1 -m "v1.0.1 — bugfix"
#   git push origin v1.0.1
# and this workflow builds + uploads to PyPI via Trusted Publishing.
#
# REQUIRES (one-time, on the PyPI side):
#   1. Create the project on PyPI by uploading once manually OR
#      pre-register it via the trusted-publishing setup form at
#      https://pypi.org/manage/account/publishing/
#   2. Add a Trusted Publisher with:
#        Repo:      joemunene-by/ghostloop
#        Workflow:  publish-pypi.yml
#        Env name:  pypi
#   No PyPI API token needs to live in the repo. PyPI verifies the
#   GitHub OIDC claim and authorises the upload.

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab too.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build sdist + wheel and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ghostloop
    permissions:
      # Required by the official PyPA action for OIDC trusted publishing.
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify version matches the tag
        run: |
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          PKG_VERSION=$(python -c "import re,pathlib;m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('ghostloop/__init__.py').read_text()); print(m.group(1))")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "ghostloop/__init__.py: $PKG_VERSION"
          echo "git tag: $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ] || [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — fix pyproject.toml + ghostloop/__init__.py to match the tag and re-tag."
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel + sdist metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No password / token field — OIDC handles authentication.
          # If TestPyPI dry-runs are needed, swap the repository-url:
          # repository-url: https://test.pypi.org/legacy/
          print-hash: true

      - name: Upload wheel as workflow artifact
        # Useful for downloading the exact wheel that was published from
        # the Actions UI, in case PyPI search is slow.
        uses: actions/upload-artifact@v4
        with:
          name: ghostloop-${{ github.ref_name }}
          path: dist/
          retention-days: 90
