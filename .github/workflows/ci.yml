name: CI

# Standard CI: run tests on push to main + every PR. Catches regressions
# before a release tag triggers the publish workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ghostloop with dev extras
        run: |
          python -m pip install --upgrade pip
          # Core install only — backend extras (mujoco / pybullet / gym /
          # ros2 / mcp / dashboard / otel) are gated and their tests skip
          # cleanly when those libs aren't present. Install [mcp,dashboard]
          # so the dashboard + MCP smoke paths get exercised.
          pip install -e ".[dev,mcp,dashboard]"

      - name: Run tests
        run: python -m pytest tests/ -q

  physics:
    name: pytest with MuJoCo + Menagerie (IK, conformance, cross-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache MuJoCo Menagerie subset
        uses: actions/cache@v4
        with:
          path: ~/.cache/ghostloop/mujoco_menagerie
          key: menagerie-ur5e-panda-v1
      - name: Fetch UR5e + Panda models
        run: |
          dest=~/.cache/ghostloop/mujoco_menagerie
          if [ ! -d "$dest/universal_robots_ur5e" ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/google-deepmind/mujoco_menagerie.git "$dest"
            git -C "$dest" sparse-checkout set universal_robots_ur5e franka_emika_panda
          fi
      - name: Install ghostloop with physics + model extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mujoco,anthropic]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Cross-backend smoke report
        run: |
          python -m ghostloop xbench --preset reach_8 --a mujoco:ur5e --b mujoco:panda \
            --seeds 0 --out-dir xbench-out
      - uses: actions/upload-artifact@v7
        with:
          name: xbench-report
          path: xbench-out/

  build:
    name: Build sdist + wheel (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
